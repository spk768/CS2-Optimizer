name: build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: go test ./...

      - name: Recursos do Windows (ícone, manifesto, versão)
        run: |
          pip install pillow
          python tools/mkres.py rsrc_windows_amd64.syso

      - name: Compilar
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go vet .
          go build -trimpath -ldflags "-H windowsgui -s -w" -o "CS2 Optimizer.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: CS2-Optimizer
          path: CS2 Optimizer.exe

      - name: Publicar no Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CS2 Optimizer.exe
          generate_release_notes: true
